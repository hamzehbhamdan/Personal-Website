<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — Fourier Drawing Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f9f8f6; --bg-raised: #fff; --border: #e7e5e4;
  --text: #1c1917; --faint: #a8a29e; --mid: #57534e;
  --accent: #A51C30; --canvas-bg: #0f0e0d;
  --mono: 'SF Mono','Cascadia Code','Fira Code',ui-monospace,monospace;
  --serif: 'Playfair Display',Georgia,serif;
  --ease: cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; -webkit-font-smoothing: antialiased; overflow: hidden; }

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100%; }
.phase-label {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg); flex-shrink: 0;
}
.phase-num {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 10px; display: flex; align-items: center; justify-content: center;
}
.phase-title { font-size: 10px; text-transform: uppercase; letter-spacing: .15em; color: var(--mid); }

/* ── Mode tabs ── */
.mode-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  background: var(--bg); flex-shrink: 0;
}
.mode-tab {
  flex: 1; padding: 9px 4px; font-family: var(--mono);
  font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--faint); cursor: pointer; transition: all .2s;
}
.mode-tab:hover { color: var(--mid); }
.mode-tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* ── Panes ── */
.pane { display: none; flex: 1; overflow: hidden; }
.pane.active { display: flex; flex-direction: column; }

/* ── Upload pane ── */
.upload-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; padding: 20px;
}
.drop-zone {
  width: 100%; max-width: 340px;
  border: 1.5px dashed var(--border); padding: 28px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer; transition: all .2s; position: relative;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(165,28,48,.04); }
.drop-zone svg { color: var(--faint); }
.drop-zone-text { font-size: 10px; text-transform: uppercase; letter-spacing: .15em; color: var(--faint); }
.drop-zone-sub { font-size: 9px; color: var(--faint); opacity: .7; }
.file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.upload-preview {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 16px;
}
.preview-img { max-width: 200px; max-height: 150px; object-fit: contain; border: 1px solid var(--border); }
.done-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
  color: #22c55e; padding: 6px 12px; border: 1px solid #22c55e33; background: #22c55e0a;
}
.done-badge svg { width: 12px; height: 12px; }
.btn-secondary {
  font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
  padding: 6px 14px; border: 1px solid var(--border); background: none; color: var(--faint);
  cursor: pointer; transition: all .2s;
}
.btn-secondary:hover { border-color: var(--mid); color: var(--mid); }

/* ── Draw pane ── */
.draw-area { flex: 1; display: flex; flex-direction: column; }
.draw-controls {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.draw-stat { font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.draw-stat span { color: var(--text); }
.btn-ghost {
  font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .12em;
  padding: 4px 10px; border: 1px solid var(--border); background: none; color: var(--faint);
  cursor: pointer; transition: all .2s; margin-left: auto;
}
.btn-ghost:hover { border-color: var(--mid); color: var(--mid); }
.draw-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#draw-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.draw-hint {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; pointer-events: none;
  transition: opacity .3s;
}
.draw-hint-icon { color: var(--faint); opacity: .4; }
.draw-hint-text { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .15em; }
.draw-done-overlay {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
  color: #22c55e; padding: 6px 12px; border: 1px solid #22c55e33; background: #0f0e0d99;
  backdrop-filter: blur(4px); pointer-events: none; opacity: 0; transition: opacity .3s;
}
.draw-done-overlay.show { opacity: 1; }

/* ── Sample pane ── */
.sample-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; }
.sample-label { font-size: 9px; text-transform: uppercase; letter-spacing: .2em; color: var(--faint); }
.sample-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.sample-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 18px; border: 1.5px solid var(--border); background: var(--bg-raised);
  cursor: pointer; transition: all .2s; font-family: var(--mono);
}
.sample-btn:hover { border-color: var(--accent); background: rgba(165,28,48,.03); }
.sample-btn.selected { border-color: var(--accent); background: rgba(165,28,48,.06); }
.sample-btn svg { width: 60px; height: 60px; }
.sample-btn-label { font-size: 9px; text-transform: uppercase; letter-spacing: .15em; color: var(--faint); }
.sample-done {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
  color: #22c55e; padding: 6px 12px; border: 1px solid #22c55e33; background: #22c55e0a;
  opacity: 0; transition: opacity .3s;
}
.sample-done.show { opacity: 1; }
.sample-done svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div id="app">
  <!-- Phase label -->
  <div class="phase-label">
    <div class="phase-num">1</div>
    <span class="phase-title">Give it something to draw</span>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-pane="upload">Upload image</button>
    <button class="mode-tab" data-pane="draw">Draw freehand</button>
    <button class="mode-tab" data-pane="sample">Use a sample</button>
  </div>

  <!-- Upload pane -->
  <div class="pane active" id="pane-upload">
    <div class="upload-area" id="upload-idle">
      <div class="drop-zone" id="drop-zone">
        <input type="file" class="file-input" id="file-input" accept="image/*">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <div class="drop-zone-text">Drop image here or click to browse</div>
        <div class="drop-zone-sub">PNG, JPG, SVG — high contrast works best</div>
      </div>
    </div>
    <div class="upload-preview" id="upload-preview" style="display:none;">
      <img id="preview-img" class="preview-img" alt="Uploaded image">
      <div class="done-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Phase 1 complete — scroll down
      </div>
      <button class="btn-secondary" id="upload-reset-btn">Use a different image</button>
    </div>
  </div>

  <!-- Draw pane -->
  <div class="pane" id="pane-draw">
    <div class="draw-controls">
      <div class="draw-stat">Points: <span id="pt-count">0</span></div>
      <button class="btn-ghost" id="draw-clear-btn">Clear</button>
    </div>
    <div class="draw-canvas-wrap">
      <canvas id="draw-canvas"></canvas>
      <div class="draw-hint" id="draw-hint">
        <svg class="draw-hint-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <div class="draw-hint-text">Click and drag to draw a closed shape</div>
      </div>
      <div class="draw-done-overlay" id="draw-done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Phase 1 complete — scroll down
      </div>
    </div>
  </div>

  <!-- Sample pane -->
  <div class="pane" id="pane-sample">
    <div class="sample-area">
      <div class="sample-label">Pick a preset shape</div>
      <div class="sample-grid">
        <button class="sample-btn" data-sample="heart">
          <svg viewBox="-200 -200 400 400" fill="none" stroke="currentColor" stroke-width="12">
            <path d="M0,60 C-80,-40 -200,-20 -150,-120 C-100,-220 0,-130 0,-130 C0,-130 100,-220 150,-120 C200,-20 80,-40 0,60Z" fill="none"/>
          </svg>
          <span class="sample-btn-label">Heart</span>
        </button>
        <button class="sample-btn" data-sample="star">
          <svg viewBox="-220 -220 440 440" fill="none" stroke="currentColor" stroke-width="12">
            <polygon points="0,-190 45,-65 180,-60 75,40 110,175 0,100 -110,175 -75,40 -180,-60 -45,-65" fill="none"/>
          </svg>
          <span class="sample-btn-label">Star</span>
        </button>
        <button class="sample-btn" data-sample="treble">
          <svg viewBox="-80 -320 160 360" fill="none" stroke="currentColor" stroke-width="8">
            <path d="M0,-300 C50,-300 70,-250 40,-200 C70,-160 70,-100 40,-60 C20,-30 -10,-20 0,0 M0,0 C-40,-20 -50,20 -20,30 C20,50 40,20 20,-10" fill="none"/>
          </svg>
          <span class="sample-btn-label">Treble</span>
        </button>
      </div>
      <div class="sample-done" id="sample-done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="sample-done-text">Phase 1 complete — scroll down</span>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'fdm_input';

// ── Tabs ──
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
    if (tab.dataset.pane === 'draw') resizeDrawCanvas();
  });
});

// ── Upload ──
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const uploadIdle = document.getElementById('upload-idle');
const uploadPreview = document.getElementById('upload-preview');
const previewImg = document.getElementById('preview-img');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

document.getElementById('upload-reset-btn').addEventListener('click', () => {
  uploadIdle.style.display = '';
  uploadPreview.style.display = 'none';
  fileInput.value = '';
  localStorage.removeItem(STORAGE_KEY);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // Downscale to max 600px
      const maxDim = 600;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const offscreen = Object.assign(document.createElement('canvas'), { width: w, height: h });
      offscreen.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataURL = offscreen.toDataURL('image/jpeg', 0.85);
      previewImg.src = dataURL;
      uploadIdle.style.display = 'none';
      uploadPreview.style.display = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ source: 'image', imageDataURL: dataURL, width: w, height: h, timestamp: Date.now() }));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Draw ──
const drawCanvas = document.getElementById('draw-canvas');
const drawCtx = drawCanvas.getContext('2d');
const drawHint = document.getElementById('draw-hint');
const drawDone = document.getElementById('draw-done');
const ptCount = document.getElementById('pt-count');
let pts = [], isDrawing = false, hasDraw = false;

function resizeDrawCanvas() {
  const wrap = drawCanvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  drawCanvas.width = wrap.clientWidth * dpr;
  drawCanvas.height = wrap.clientHeight * dpr;
  drawCtx.scale(dpr, dpr);
  drawCtx.fillStyle = '#0a0a0f';
  drawCtx.fillRect(0, 0, wrap.clientWidth, wrap.clientHeight);
  if (pts.length) redrawPath();
}

function redrawPath() {
  const dpr = window.devicePixelRatio || 1;
  const W = drawCanvas.width / dpr, H = drawCanvas.height / dpr;
  drawCtx.fillStyle = '#0a0a0f'; drawCtx.fillRect(0, 0, W, H);
  if (!pts.length) return;
  drawCtx.beginPath(); drawCtx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => drawCtx.lineTo(p.x, p.y));
  drawCtx.strokeStyle = '#e7e5e4'; drawCtx.lineWidth = 2;
  drawCtx.lineJoin = 'round'; drawCtx.lineCap = 'round'; drawCtx.stroke();
}

function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function saveDraw() {
  // Center and normalize points
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
  const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const normalized = pts.map(p => ({ x: p.x - cx, y: p.y - cy }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ source: 'freehand', points: normalized, timestamp: Date.now() }));
  drawDone.classList.add('show');
  hasDraw = true;
}

drawCanvas.addEventListener('pointerdown', e => {
  if (pts.length && hasDraw) { pts = []; hasDraw = false; drawDone.classList.remove('show'); redrawPath(); }
  isDrawing = true; drawHint.style.opacity = '0';
  const p = getPos(e); pts.push(p);
  drawCtx.beginPath(); drawCtx.moveTo(p.x, p.y);
  drawCanvas.setPointerCapture(e.pointerId);
});
drawCanvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  const p = getPos(e); pts.push(p);
  drawCtx.lineTo(p.x, p.y);
  drawCtx.strokeStyle = '#e7e5e4'; drawCtx.lineWidth = 2;
  drawCtx.lineJoin = 'round'; drawCtx.lineCap = 'round'; drawCtx.stroke();
  ptCount.textContent = pts.length;
});
drawCanvas.addEventListener('pointerup', () => {
  if (!isDrawing) return; isDrawing = false;
  if (pts.length > 15) { // close the path
    drawCtx.lineTo(pts[0].x, pts[0].y); drawCtx.stroke();
    pts.push({ ...pts[0] });
    saveDraw();
  }
});
drawCanvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.getElementById('draw-clear-btn').addEventListener('click', () => {
  pts = []; hasDraw = false; isDrawing = false;
  drawDone.classList.remove('show');
  drawHint.style.opacity = '';
  ptCount.textContent = '0';
  const dpr = window.devicePixelRatio || 1;
  drawCtx.fillStyle = '#0a0a0f';
  drawCtx.fillRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
  localStorage.removeItem(STORAGE_KEY);
});

// ── Samples ──
function generatePoints(type) {
  const N = 500, pts = [];
  if (type === 'star') {
    for (let i = 0; i < N; i++) {
      const angle = (i / N) * Math.PI * 2;
      const r = i % (N/5) < N/10 ? 150 : 65;
      pts.push({ x: Math.cos(angle - Math.PI/2) * r, y: Math.sin(angle - Math.PI/2) * r });
    }
  } else if (type === 'heart') {
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      pts.push({ x: 16 * Math.pow(Math.sin(t), 3) * 9, y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * 9 });
    }
  } else if (type === 'treble') {
    const segs = [
      ...Array.from({length:150},(_,i)=>{ const t=(i/150)*Math.PI*2.5; const r=30+t*18; return {x:Math.cos(t+Math.PI)*r*.6, y:Math.sin(t+Math.PI)*r+40}; }),
      ...Array.from({length:100},(_,i)=>{ const t=i/100; return {x:-10+Math.sin(t*Math.PI)*25, y:40-t*320}; }),
      ...Array.from({length:100},(_,i)=>{ const t=(i/100)*Math.PI; return {x:-10+Math.cos(t)*50, y:-280+Math.sin(t)*40}; }),
      ...Array.from({length:150},(_,i)=>{ const t=i/150; return {x:-10-Math.sin(t*Math.PI*.5)*30, y:-280+t*320}; }),
    ];
    return segs;
  }
  return pts;
}

document.querySelectorAll('.sample-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sample-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    const type = btn.dataset.sample;
    const points = generatePoints(type);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ source: 'sample', sampleType: type, points, timestamp: Date.now() }));
    const doneEl = document.getElementById('sample-done');
    document.getElementById('sample-done-text').textContent = `${type.charAt(0).toUpperCase()+type.slice(1)} selected — scroll down`;
    doneEl.classList.add('show');
  });
});

// Init draw canvas on load
window.addEventListener('load', () => {
  if (document.getElementById('pane-draw').classList.contains('active')) resizeDrawCanvas();
  // If phase1 data already exists, show completion state
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && saved.timestamp) {
      if (saved.source === 'image') {
        previewImg.src = saved.imageDataURL;
        uploadIdle.style.display = 'none';
        uploadPreview.style.display = '';
      } else if (saved.source === 'freehand') {
        // Switch to draw tab and show done
        document.querySelector('[data-pane="draw"]').click();
        pts = saved.points.map(p => ({ x: p.x + 150, y: p.y + 120 }));
        resizeDrawCanvas(); redrawPath();
        drawDone.classList.add('show');
        hasDraw = true;
      } else if (saved.source === 'sample') {
        document.querySelector('[data-pane="sample"]').click();
        document.querySelector(`[data-sample="${saved.sampleType}"]`)?.classList.add('selected');
        document.getElementById('sample-done').classList.add('show');
      }
    }
  } catch(e) {}
});
window.addEventListener('resize', () => {
  if (document.getElementById('pane-draw').classList.contains('active')) resizeDrawCanvas();
});
</script>
</body>
</html>
