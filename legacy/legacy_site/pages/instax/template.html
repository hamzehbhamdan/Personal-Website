<!DOCTYPE html>
<html>
  <head>
    <title>Instax Moment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="../../css/core.css">
    <link rel="stylesheet" type="text/css" href="../../css/base.css">
    <link rel="stylesheet" type="text/css" href="../../css/custom.css">
    <link rel="icon" type="image/png" href="../../favicon.png?v=2">
    <script src="../../js/assets/jquery.js"></script>
  </head>
  <body class="instax-page">
    <div class="body-overlay"></div>
    <!-- Wrapper-->
    <div id="wrapper" class="container-fluid smooth-transition">
      <section class="content">
        <div class="container intro">
          <div class="row">
            <div class="col-md-10 col-md-offset-1">
              <!-- Media -->
              <div class="instax-media">
                <!-- Replace the img below with your own image in images/instax/ -->
                <img src="../../images/instax/placeholder.jpg" alt="Instax moment" class="responsive-media">
                <!-- Or use a video instead: uncomment and set your file -->
                <!--
                <video controls class="responsive-media">
                  <source src="../../images/instax/placeholder.mp4" type="video/mp4">
                </video>
                -->
              </div>
              <!-- Meta -->
              <div class="instax-meta">
                <h1 class="title">Title of Moment</h1>
                <div class="meta-line"><span class="meta-label">Date:</span> <span class="meta-value">YYYY-MM-DD</span></div>
                <div class="meta-line"><span class="meta-label">Location:</span> <span class="meta-value">City, Country</span></div>
                <p class="instax-description">
                  Add your description here. A few sentences about the memory behind the photo or video.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="../../js/assets/bootstrap.js"></script>
    <script src="../../js/assets/imagesloaded.pkgd.min.js"></script>
    <script src="../../js/assets/validation.js"></script>
    <script src="../../js/assets/masonry.pkgd.min.js"></script>
    <script src="../../modules/tera-slider/tera-slider.js"></script>
    <script src="../../modules/tera-lightbox/tera-lightbox.js"></script>
    <script src="../../js/assets/animsition.js"></script>
    <script src="../../js/functions.js"></script>
  </body>
  </html>
