[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Non-secret env values, omitted by KEY (not path) so the scanner still inspects
  # the build output + repo for accidental REAL server-secret leaks:
  #  - NEXT_PUBLIC_*        : intentionally client-exposed (inlined into the browser bundle).
  #  - ALLOWED_EMAIL        : the single allow-listed address — not a credential.
  #  - GOOGLE_OAUTH_REDIRECT: the public OAuth callback URL (sent in every consent request,
  #    visible in the browser during the flow). Its value is documented verbatim in
  #    docs/superpowers/plans/*a1*.md, which the scanner reads — hence the false positive.
  # Real secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, TOKEN_ENC_KEY, GCAL_CLIENT_SECRET) are
  # deliberately NOT omitted, so a genuine leak would still fail the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,ALLOWED_EMAIL,GOOGLE_OAUTH_REDIRECT"
  # Only omit static public assets (incl. public/playground/mcp-injection-lab corpus, whose
  # canary/decoy tokens would otherwise trip false positives). Do NOT omit .next — let the
  # scanner watch the build output so a server-secret bundle leak is caught.
  SECRETS_SCAN_OMIT_PATHS = "public"
  #
  # ⚠ RESIDUAL RISKS (adversarially audited 2026-07-15; also documented in spec §5.7):
  #  1. The anon-key omission is safe ONLY while strict RLS is enforced on the LIVE Supabase
  #     project. NEXT_PUBLIC_SUPABASE_ANON_KEY ships to the browser by design and is non-secret
  #     purely because per-owner RLS (auth.uid()=user_id; no service_role / nil-UUID / using(true)
  #     backdoor) blocks it. If RLS were ever weakened, the omitted public key becomes a full
  #     data read/write exposure that the scanner is no longer watching. INVARIANT: keep RLS strict
  #     on every table. Hardening: a deploy assertion that an anon-key SELECT returns 0 rows.
  #  2. OMIT_PATHS="public" skips the WHOLE public/ tree (served world-readable) — a real secret
  #     manually dropped anywhere under public/ would ship un-flagged. None is there today and the
  #     build never writes env values into public/ (only into the still-scanned .next). Hardening:
  #     narrow to "public/playground/mcp-injection-lab" (the only dir with decoys) so the rest of
  #     public/ stays scanned — test against Netlify's scan before applying.

# ── Static-asset headers (CDN-served) ──────────────────────────────────────
# next.config.ts headers() applies ONLY to Next-served routes. On Netlify,
# files under public/ (all of /playground/**) and /_next/static/* are served
# straight from the CDN and get NONE of those headers (live-verified
# 2026-07-19: the mcp-injection-lab pages returned no X-Robots-Tag, no CSP,
# no X-Frame-Options, no nosniff). These blocks close that gap.
# Netlify applies ALL matching rules cumulatively and does NOT apply custom
# headers to function (Next-served) responses — so: no header key may appear
# in two rules matching the same path, and none of this duplicates the
# next.config.ts headers on app routes. KEEP IN SYNC with next.config.ts.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Tailored CSP for the static playground pages ONLY (finding #44: do NOT
# blanket-apply the app's strict CSP — these pages use inline <script>,
# Google Fonts, and Chart.js from jsdelivr). Deltas vs the app CSP:
# +cdn.jsdelivr.net (script), +fonts.googleapis.com (style),
# +fonts.gstatic.com (font), -plausible.io, -*.supabase.co,
# frame-ancestors 'self' (fourier phase pages are iframed by
# /blog/fourier-drawing-machine). CSP must NOT be added to the /* rule:
# multiple matching CSPs intersect and the strictest would win.
[[headers]]
  for = "/playground/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; form-action 'self'"

# The 28-page prompt-injection corpus (ai/1-28.html) must not be indexed or
# AI-ingested under this domain. The splat matches across segments.
# Deliberately NO robots.txt Disallow (finding #43): crawlers must be able
# to fetch these pages, or they never see the noindex.
[[headers]]
  for = "/playground/mcp-injection-lab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
