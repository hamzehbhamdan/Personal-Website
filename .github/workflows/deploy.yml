# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

# NOTE: GitHub Pages serves the public marketing site (hamzehhamdan.com) only.
# The dashboard (my.hamzehhamdan.com) is served by Netlify. Actions are pinned by SHA.

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      # SECURITY: GitHub Pages runs NO middleware, so any exported app route would be
      # served unauthenticated. Remove the authenticated app surface from this ephemeral
      # CI checkout BEFORE the static export runs. The `output: export` build errors on
      # these dynamic route handlers / server actions before it can emit ./out, so a
      # post-build prune is not sufficient — they must be gone before `next build`.
      # Marketing pages only link to these routes as href strings; they never import them.
      # components/dashboard is the dashboard-only UI layer (imported solely by
      # app/dashboard); it must go too, otherwise `next build`'s project-wide TypeScript
      # check fails on its now-dangling import of app/dashboard/actions.
      - name: Exclude authenticated app surface from static export
        run: rm -rf app/dashboard app/login app/auth app/api components/dashboard
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      # SECURITY GUARD: fail the Pages deploy if any authenticated route leaked into ./out.
      - name: Assert app surface did not leak into export
        run: |
          leaked=0
          for d in dashboard login auth api; do
            for p in "out/$d" "out/$d.html" "out/$d.txt"; do
              if [ -e "$p" ]; then
                echo "SECURITY: $p leaked into the Pages export"
                leaked=1
              fi
            done
          done
          if [ "$leaked" -ne 0 ]; then exit 1; fi
          echo "OK: no authenticated app routes present in ./out"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
