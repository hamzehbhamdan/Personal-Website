name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Advisory (non-blocking): the repo carries a large pre-existing eslint-error
      # baseline (~124 errors) in legacy dashboard code kept for reintegration, and
      # eslint exits non-zero on any error (there is no "max errors" flag), so a hard
      # lint gate can't pass until that baseline is cleared. Lint still runs and its
      # annotations surface regressions; the hard gates are Typecheck + Test + Audit.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Audit (high+)
        run: npm run audit:ci
